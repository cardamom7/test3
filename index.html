<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黄昏の解律師 - 絆の謎解きミステリー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d0d12;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 750px;
      background-color: #1a1a26;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease;
      border: 2px solid #5a4b7c;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    
    header {
      background: rgba(18, 18, 28, 0.85);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3d3d56;
      z-index: 10;
    }
    header h1 { font-size: 0.95rem; color: #e6c669; letter-spacing: 1px; }
    
    .bgm-btn {
      background: #3d3d56; color: #fff; border: 1px solid #5a4b7c; padding: 5px 12px;
      border-radius: 12px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
    }
    .bgm-btn.playing {
      background: #e6c669; color: #1a1a26; font-weight: bold; border-color: #fff;
      box-shadow: 0 0 8px rgba(230, 198, 105, 0.6);
    }

    #stage-screen {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #chara-container {
      position: absolute;
      bottom: -10px;
      right: -30px;
      width: 420px;
      height: 520px;
      pointer-events: none;
      z-index: 3;
    }
    .chara-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: right bottom;
      transition: all 0.3s ease;
      opacity: 0.4;
      filter: brightness(0.5);
    }
    .chara-img.active {
      opacity: 1;
      filter: brightness(1);
      transform: translateY(-5px);
    }

    .inspect-obj {
      position: absolute;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #e6c669;
      border-radius: 8px;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      text-shadow: 0 1px 3px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 4;
      transition: transform 0.1s, background 0.2s;
    }
    .inspect-obj:active { transform: scale(0.95); background: rgba(230, 198, 105, 0.4); }

    #dialogue-area {
      height: 240px;
      background: rgba(20, 20, 30, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
      padding: 14px 16px 30px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      position: relative;
    }
    
    #dialogue-click-zone {
      flex: 1;
      cursor: pointer;
    }

    .speaker-tag {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .speaker-aoi { background: rgba(43, 76, 126, 0.85); color: #a5c9ff; }
    .speaker-hina { background: rgba(126, 43, 83, 0.85); color: #ffa5d8; }
    
    .dialogue-text { 
      font-size: 0.95rem; 
      line-height: 1.5; 
      color: #fff; 
      min-height: 3em; 
      text-shadow: 0 1px 3px rgba(0,0,0,0.9); 
    }

    .tap-hint {
      font-size: 0.7rem;
      color: #a0a0c0;
      text-align: right;
      margin-top: 2px;
      animation: blink 1.5s infinite;
      text-shadow: 0 1px 2px #000;
    }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .control-btns { 
      display: flex; 
      justify-content: space-between; 
      gap: 12px; 
      margin-top: 8px;
    }
    .btn-action {
      background: rgba(61, 61, 86, 0.8); 
      color: #fff; 
      border: 1px solid rgba(255,255,255,0.2); 
      padding: 8px 12px;
      border-radius: 6px; 
      font-size: 0.85rem; 
      font-weight: bold;
      cursor: pointer; 
      flex: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .btn-action:active { background: rgba(90, 75, 124, 0.9); transform: scale(0.98); }

    .modal {
      display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); flex-direction: column;
      justify-content: center; align-items: center; z-index: 20;
    }
    .modal-box {
      background: #222233; padding: 20px; border-radius: 12px;
      border: 1px solid #e6c669; text-align: center; width: 85%;
    }
    .code-input {
      width: 100%; font-size: 1.2rem; text-align: center;
      padding: 8px; margin: 15px 0; background: #12121c; color: #e6c669;
      border: 1px solid #5a4b7c; border-radius: 6px;
    }
    .color-btns { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
    .btn-color { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
    
    .clear-title {
      font-size: 1.8rem; color: #e6c669; font-weight: bold; margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1 id="stage-title">黄昏の解律師</h1>
    <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 BGM: OFF</button>
  </header>

  <div id="stage-screen">
    <div id="interactive-objects"></div>
  </div>

  <div id="chara-container">
    <img id="img-hina" class="chara-img" src="hina1.png" alt="ヒナ">
  </div>

  <div id="dialogue-area">
    <div id="dialogue-click-zone" onclick="handleDialogueTap()">
      <span id="speaker-tag" class="speaker-tag speaker-hina">ヒナ</span>
      <div id="dialogue-text" class="dialogue-text">ようこそ！</div>
      <div id="tap-hint" class="tap-hint">▼ タップして進む</div>
    </div>
    
    <div id="action-btns-area" class="control-btns">
      <button id="btn-hint" class="btn-action" onclick="showHint()">ヒントを聞く</button>
      <button id="btn-puzzle" class="btn-action" onclick="openPuzzle()">謎に挑む</button>
    </div>
  </div>

  <div id="start-modal" class="modal">
    <div class="modal-box">
      <h2 style="color:#e6c669; margin-bottom:10px;">黄昏の解律師</h2>
      <p style="font-size:0.85rem; color:#ccc;">あなたの名前を入力してください</p>
      <input type="text" id="player-name-input" class="code-input" maxlength="8" value="アオイ">
      <button class="btn-action" style="padding:10px 20px;" onclick="startGame()">調査を開始する</button>
    </div>
  </div>

  <div id="title-screen" class="modal" style="display:none; cursor:pointer;" onclick="startPrologue()">
    <div style="text-align:center;">
      <h1 style="font-size:2.4rem; color:#e6c669; letter-spacing:4px; text-shadow:0 0 15px rgba(230,198,105,0.5);">黄昏の解律師</h1>
      <p class="tap-hint" style="font-size:1rem; margin-top:40px;">▼ タップして物語を始める ▼</p>
    </div>
  </div>

  <div id="puzzle-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-title">鍵の解錠</h3>
      <div id="modal-body"></div>
      <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
        <button class="btn-action" onclick="submitAnswer()">回答する</button>
        <button class="btn-action" onclick="closeModal()">戻る</button>
      </div>
    </div>
  </div>

  <div id="clear-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <div class="clear-title">🎉 おしまい！ 🎉</div>
      <p style="font-size:0.9rem; color:#fff; margin-bottom:15px;">
        すべての謎を解き明かし、事件を解決しました！<br>ごプレイありがとうございました！
      </p>
      <button class="btn-action" style="padding:10px 20px;" onclick="location.reload()">もう一度最初から遊ぶ</button>
    </div>
  </div>
</div>

<script>
  let playerName = "アオイ";
  let currentStage = -1; 
  let storyIndex = 0;
  let selectedColorSequence = [];

  const BG_OUTSIDE = 'bg-outside.png'; 
  const BG_INSIDE  = 'bg-inside.png';  

  const prologueLines = [
    { speaker: "ヒナ", text: "ついに着いたね！ここが噂の『黄昏の館』かぁ…ちょっと不気味だけどワクワクするね！" },
    { speaker: "PLAYER", text: "油断しないでね、ヒナ。この館には強力な仕掛けが施されているって噂よ。" },
    { speaker: "ヒナ", text: "ふふん、大丈夫！私には優秀な相棒の{NAME}がいるもん！ふたりで力を合わせればどんな謎もイチコロだよ！" },
    { speaker: "PLAYER", text: "頼りにしてるわ。よし、まずは洋館の中に入りましょう！" }
  ];

  const epilogueLines = [
    { speaker: "ヒナ", text: "{NAME}！大きな扉が開いたよ！見て、外には満天の星空が…！" },
    { speaker: "PLAYER", text: "ええ、本当に綺麗ね。…ヒナが隣にいてくれたから、最後まで解き明かせたわ。ありがとう。" },
    { speaker: "ヒナ", text: "へへっ、{NAME}にそう言われると照れちゃうな。最高の相棒と一緒に謎を解けて楽しかった！" },
    { speaker: "PLAYER", text: "ふふ、私もよ。さて、事件も解決したことだし…帰りに街のカフェでパフェでも食べていきましょうか？" },
    { speaker: "ヒナ", text: "やった〜〜！{NAME}のおごりで特大パフェね！約束だよ〜！" }
  ];

  const stages = {
    1: {
      title: "STAGE 1: 書斎の金庫",
      objs: [
        { id: "clock", label: "古びた時計", style: "top: 25%; left: 8%; width: 140px; height: 80px;" },
        { id: "books", label: "整頓された本棚", style: "top: 48%; left: 16%; width: 140px; height: 80px;" }
      ],
      initDialogue: { speaker: "ヒナ", text: "まずは気になる場所をタップして調べてみよう！" }
    },
    2: {
      title: "STAGE 2: 宝石のオルゴール",
      objs: [
        { id: "picture", label: "三色の絵画", style: "top: 22%; left: 8%; width: 140px; height: 80px;" },
        { id: "letter", label: "机の上の手紙", style: "top: 45%; left: 18%; width: 140px; height: 80px;" }
      ],
      initDialogue: { speaker: "PLAYER", text: "次の部屋ね。綺麗なお部屋だけど…あのテーブルのオルゴールが怪しいわ。" }
    },
    3: {
      title: "STAGE 3: 最後の封印扉",
      objs: [
        { id: "statue", label: "月と太陽の像", style: "top: 20%; left: 12%; width: 140px; height: 80px;" },
        { id: "stone", label: "刻まれた石碑", style: "top: 50%; left: 10%; width: 140px; height: 80px;" }
      ],
      initDialogue: { speaker: "ヒナ", text: "これが最後の扉…！{NAME}、力を合わせて解き明かそう！" }
    }
  };

  function setBgImage(filename) {
    document.getElementById('game-container').style.backgroundImage = `url('${filename}')`;
  }

  function startGame() {
    const input = document.getElementById('player-name-input').value.trim();
    if (input) playerName = input;
    
    document.getElementById('start-modal').style.display = 'none';
    setBgImage(BG_OUTSIDE);
    
    document.getElementById('speaker-tag').style.opacity = 0;
    document.getElementById('dialogue-text').textContent = '';
    document.getElementById('action-btns-area').style.display = 'none';
    
    document.getElementById('title-screen').style.display = 'flex';
  }

  function startPrologue() {
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('speaker-tag').style.opacity = 1;
    currentStage = 0;
    storyIndex = 0;
    advanceStory();
  }

  function handleDialogueTap() {
    if (currentStage === 0 || currentStage === 4) advanceStory();
  }

  function advanceStory() {
    let lines = currentStage === 0 ? prologueLines : epilogueLines;
    
    if (storyIndex < lines.length) {
      let line = lines[storyIndex];
      let spk = line.speaker === "PLAYER" ? playerName : line.speaker;
      let txt = line.text.replace(/{NAME}/g, playerName);
      setDialogue(spk, txt);
      storyIndex++;
    } else {
      if (currentStage === 0) loadStage(1);
      else document.getElementById('clear-modal').style.display = 'flex';
    }
  }

  function setDialogue(speaker, text) {
    const tag = document.getElementById('speaker-tag');
    const textEl = document.getElementById('dialogue-text');
    const hinaImg = document.getElementById('img-hina');
    const tapHint = document.getElementById('tap-hint');

    const isPlayer = (speaker === playerName || speaker === "PLAYER");
    
    tag.textContent = isPlayer ? playerName : 'ヒナ';
    tag.className = `speaker-tag ${isPlayer ? 'speaker-aoi' : 'speaker-hina'}`;
    textEl.textContent = text;

    if (currentStage === 0 || currentStage === 4) tapHint.style.display = 'block';
    else tapHint.style.display = 'none';

    if (!isPlayer) hinaImg.classList.add('active');
    else hinaImg.classList.remove('active');
  }

  function loadStage(stageNum) {
    currentStage = stageNum;
    selectedColorSequence = [];

    setBgImage(BG_INSIDE);
    document.getElementById('action-btns-area').style.display = 'flex';

    const data = stages[stageNum];
    document.getElementById('stage-title').textContent = data.title;

    const container = document.getElementById('interactive-objects');
    container.innerHTML = '';
    data.objs.forEach((obj, index) => {
      const el = document.createElement('div');
      el.className = 'inspect-obj';
      el.style = obj.style;
      el.textContent = obj.label;
      el.onclick = () => inspectObject(index + 1, obj.id);
      container.appendChild(el);
    });

    let spk = data.initDialogue.speaker === "PLAYER" ? playerName : data.initDialogue.speaker;
    let txt = data.initDialogue.text.replace(/{NAME}/g, playerName);
    setDialogue(spk, txt);
  }

  function inspectObject(num, id) {
    if (currentStage === 1) {
      if (id === 'clock') setDialogue(playerName, "「3時」で止まっている時計ね。裏側に『千の位は止まった刻』と刻まれているわ。");
      else setDialogue("ヒナ", "本棚からメモを発見！『百の位は0、十の位は5、一の位は2』だって！");
    } else if (currentStage === 2) {
      if (id === 'picture') setDialogue("ヒナ", "綺麗な絵画！『赤・青・黄』のチューリップが描かれてるね。");
      else setDialogue(playerName, "手紙には『情熱（赤）で始まり、空（青）を見上げ、光（黄）に至る』と書いてあるわ。");
    } else if (currentStage === 3) {
      if (id === 'statue') setDialogue(playerName, "像の台座に『夜を照らす真実の言葉（英字4文字）を刻め』とあるわね。");
      else setDialogue("ヒナ", "石碑の文字だ！『Mで始まり、Nで終わる。夜空に浮かぶ丸いもの…』何だろう？");
    }
  }

  function showHint() {
    if (currentStage === 1) setDialogue("ヒナ", "時計の数字(3)と、本のメモ(052)を繋げると4桁の番号になるはずだよ！");
    else if (currentStage === 2) setDialogue(playerName, "手紙の文章が示す色の順番（情熱→空→光）を試してみましょう。");
    else if (currentStage === 3) setDialogue("ヒナ", "「Mから始まってNで終わる、夜空の丸いもの」…月（つき）を英語で言うと何だっけ？");
  }

  function openPuzzle() {
    const modal = document.getElementById('puzzle-modal');
    const body = document.getElementById('modal-body');
    modal.style.display = 'flex';

    if (currentStage === 1) {
      body.innerHTML = `<p style="font-size:0.8rem; color:#aaa;">4桁の数字を入力してください</p><input type="text" id="ans-input" class="code-input" maxlength="4" placeholder="0000" inputmode="numeric">`;
    } else if (currentStage === 2) {
      selectedColorSequence = [];
      body.innerHTML = `<p style="font-size:0.8rem; color:#aaa;">正しい順番で色ボタンを押してください</p>
        <div class="color-btns">
          <button class="btn-color" style="background:#e74c3c" onclick="pressColor('赤')"></button>
          <button class="btn-color" style="background:#3498db" onclick="pressColor('青')"></button>
          <button class="btn-color" style="background:#f1c40f" onclick="pressColor('黄')"></button>
        </div><div id="color-log" style="color:#e6c669; font-weight:bold; height:1.5em;"></div>`;
    } else if (currentStage === 3) {
      body.innerHTML = `<p style="font-size:0.8rem; color:#aaa;">英単語4文字（大文字）を入力してください</p><input type="text" id="ans-input" class="code-input" maxlength="4" placeholder="WORD" style="text-transform:uppercase;">`;
    }
  }

  function pressColor(color) {
    selectedColorSequence.push(color);
    document.getElementById('color-log').textContent = selectedColorSequence.join(" ➔ ");
  }

  function closeModal() { document.getElementById('puzzle-modal').style.display = 'none'; }

  function submitAnswer() {
    if (currentStage === 1) {
      if (document.getElementById('ans-input').value === '3052') {
        closeModal();
        setDialogue(playerName, "見事ね！金庫が開いて『台座の鍵』を手に入れたわ。次の部屋へ行きましょう！");
        setTimeout(() => loadStage(2), 2500);
      } else alert("番号が違うようだ…");
    } else if (currentStage === 2) {
      if (selectedColorSequence.join(",") === "赤,青,黄") {
        closeModal();
        setDialogue("ヒナ", "やった〜！きれいな音色が鳴って奥の隠し扉が開いたよ！ラストスパートだね！");
        setTimeout(() => loadStage(3), 2500);
      } else {
        alert("音が響かない… 順番が違うようだ。");
        selectedColorSequence = []; document.getElementById('color-log').textContent = '';
      }
    } else if (currentStage === 3) {
      if (document.getElementById('ans-input').value.toUpperCase() === 'MOON') {
        closeModal(); startEpilogue();
      } else alert("扉はびくともしない…");
    }
  }

  function startEpilogue() {
    currentStage = 4; storyIndex = 0;
    document.getElementById('interactive-objects').innerHTML = '';
    document.getElementById('stage-title').textContent = "EPILOGUE: 事件解決";
    document.getElementById('action-btns-area').style.display = 'none';
    setBgImage(BG_OUTSIDE);
    advanceStory();
  }

  let audioCtx = null;
  let isBgmPlaying = false;
  let bgmInterval = null;

  function toggleBGM() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const btn = document.getElementById('bgm-btn');

    if (isBgmPlaying) {
      clearInterval(bgmInterval);
      isBgmPlaying = false;
      btn.textContent = "🎵 BGM: OFF";
      btn.classList.remove('playing');
    } else {
      isBgmPlaying = true;
      btn.textContent = "🎶 BGM: ON";
      btn.classList.add('playing');

      let notes = [261.63, 329.63, 392.00, 493.88];
      let step = 0;
      bgmInterval = setInterval(() => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = notes[step % notes.length];
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        step++;
      }, 600);
    }
  }
</script>

</body>
</html>
