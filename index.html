<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黄昏の解律師 - 絆の謎解きミステリー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d0d12;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 680px; /* 縦幅を少し長めに調整 */
      background-color: #1a1a26;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease;
      border: 2px solid #5a4b7c;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    
    header {
      background: #12121c;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3d3d56;
      z-index: 10;
    }
    header h1 { font-size: 0.9rem; color: #e6c669; letter-spacing: 1px; }
    
    .header-btns { display: flex; gap: 5px; }
    .bgm-btn {
      background: #3d3d56; color: #fff; border: 1px solid #5a4b7c; padding: 4px 8px;
      border-radius: 10px; font-size: 0.65rem; cursor: pointer; transition: all 0.2s;
    }
    .bgm-btn.playing {
      background: #e6c669; color: #1a1a26; font-weight: bold; border-color: #fff;
      box-shadow: 0 0 8px rgba(230, 198, 105, 0.6);
    }

    #stage-screen {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    /* 満天の星空エフェクト（エピローグ用） */
    .starry-sky {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at bottom, #1b1b3a 0%, #080810 100%);
      z-index: 0;
      display: none;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

    /* キャラクターの位置とサイズ */
    #chara-container {
      position: absolute;
      bottom: -10px;
      right: 0px;
      width: 190px;
      height: 270px;
      pointer-events: none;
      z-index: 6;
    }
    .chara-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom right;
      transition: all 0.3s ease;
      opacity: 0.4;
      filter: brightness(0.5);
    }
    .chara-img.active {
      opacity: 1;
      filter: brightness(1);
      transform: translateY(-3px);
    }

    .inspect-obj {
      position: absolute;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #e6c669;
      border-radius: 8px;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      text-shadow: 0 1px 3px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 4;
      transition: transform 0.1s, background 0.2s;
    }
    .inspect-obj:active { transform: scale(0.95); background: rgba(230, 198, 105, 0.4); }

    /* セリフの吹き出し部分（下部エリア） */
    #dialogue-area {
      height: 165px;
      background: #14141e;
      border-top: 2px solid #3d3d56;
      padding: 10px 14px 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      position: relative;
    }
    
    #dialogue-click-zone {
      flex: 1;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .speaker-tag {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }
    .speaker-aoi { background: #2b4c7e; color: #a5c9ff; }
    .speaker-hina { background: #7e2b53; color: #ffa5d8; }
    
    .dialogue-text { 
      font-size: 0.88rem; 
      line-height: 1.4; 
      color: #fff; 
      min-height: 3.2em; 
    }

    .tap-hint {
      font-size: 0.7rem;
      color: #e6c669;
      text-align: right;
      margin-top: 8px; /* セリフからしっかり離して配置 */
      animation: blink 1.5s infinite;
      font-weight: bold;
    }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .control-btns { 
      display: flex; 
      justify-content: space-between; 
      gap: 8px; 
      margin-top: 6px;
    }
    .btn-action {
      background: #3d3d56; 
      color: #fff; 
      border: 1px solid #5a4b7c; 
      padding: 6px 10px;
      border-radius: 6px; 
      font-size: 0.8rem; 
      font-weight: bold;
      cursor: pointer; 
      flex: 1;
    }
    .btn-action:active { background: #5a4b7c; transform: scale(0.98); }

    .modal {
      display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); flex-direction: column;
      justify-content: center; align-items: center; z-index: 20;
    }
    .modal-box {
      background: #222233; padding: 20px; border-radius: 12px;
      border: 1px solid #e6c669; text-align: center; width: 85%;
    }
    .code-input {
      width: 100%; font-size: 1.1rem; text-align: center;
      padding: 8px; margin: 12px 0; background: #12121c; color: #e6c669;
      border: 1px solid #5a4b7c; border-radius: 6px;
    }
    .color-btns { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
    .btn-color { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
    
    .clear-title {
      font-size: 1.6rem; color: #e6c669; font-weight: bold; margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1 id="stage-title">黄昏の解律師</h1>
    <div class="header-btns">
      <button id="bgm-btn-1" class="bgm-btn" onclick="toggleBGM(1)">🎵 探索曲</button>
      <button id="bgm-btn-2" class="bgm-btn" onclick="toggleBGM(2)">🎶 謎解き曲</button>
    </div>
  </header>

  <div id="stage-screen">
    <div id="starry-sky" class="starry-sky"></div>
    <div id="interactive-objects"></div>
    <div id="chara-container">
      <img id="img-hina" class="chara-img" src="hina1.png" alt="ヒナ">
    </div>
  </div>

  <div id="dialogue-area">
    <div id="dialogue-click-zone" onclick="handleDialogueTap()">
      <div>
        <span id="speaker-tag" class="speaker-tag speaker-hina">ヒナ</span>
        <div id="dialogue-text" class="dialogue-text">ようこそ！</div>
      </div>
      <div id="tap-hint" class="tap-hint">▼ タップして進む</div>
    </div>
    
    <div id="action-btns-area" class="control-btns">
      <button id="btn-hint" class="btn-action" onclick="showHint()">ヒントを聞く</button>
      <button id="btn-puzzle" class="btn-action" onclick="openPuzzle()">謎に挑む</button>
    </div>
  </div>

  <div id="start-modal" class="modal">
    <div class="modal-box">
      <h2 style="color:#e6c669; margin-bottom:10px; font-size:1.3rem;">黄昏の解律師</h2>
      <p style="font-size:0.85rem; color:#ccc; line-height:1.4;">幼馴染であるあなたとヒナの、知られざる絆のミステリー。<br>あなたの名前を入力してください</p>
      <input type="text" id="player-name-input" class="code-input" maxlength="8" value="アオイ">
      <button class="btn-action" style="padding:10px 20px;" onclick="startGame()">調査を開始する</button>
    </div>
  </div>

  <div id="puzzle-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-title" style="font-size:1.1rem; color:#e6c669;">鍵の解錠</h3>
      <div id="modal-body"></div>
      <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
        <button class="btn-action" onclick="submitAnswer()">回答する</button>
        <button class="btn-action" onclick="closeModal()">戻る</button>
      </div>
    </div>
  </div>

  <div id="clear-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <div class="clear-title">✨ 事件解決・満天の星空へ ✨</div>
      <p style="font-size:0.9rem; color:#fff; margin-bottom:15px; line-height:1.5;">
        すべての謎を解き明かし、幼馴染のふたりは満天の星空が広がる外の世界へと脱出しました！<br>最高のコンビネーションでしたね！
      </p>
      <button class="btn-action" style="padding:10px 20px;" onclick="location.reload()">もう一度最初から遊ぶ</button>
    </div>
  </div>
</div>

<script>
  let playerName = "アオイ";
  let currentStage = 0; // 0: プロローグ, 1〜3: ステージ, 4: エピローグ
  let storyIndex = 0;
  let selectedColorSequence = [];

  const BG_OUTSIDE = 'bg-outside.png'; 
  const BG_INSIDE  = 'bg-inside.png';  

  const prologueLines = [
    { speaker: "ヒナ", text: "ついに着いたね、{NAME}！ここが噂の『黄昏の館』かぁ…子供の頃によく遊んだ秘密基地の裏山より、ずっと不気味でワクワクするね！" },
    { speaker: "PLAYER", text: "もう、ヒナは昔からすぐこういう危なそうな場所に惹きつけられるんだから。でも、幼馴染の私としては放っておけないわね。" },
    { speaker: "ヒナ", text: "ふふん、頼もしい相棒を持って私は世界一幸せ者だよ！長い付き合いの私たちコンビなら、どんな難解な謎もイチコロさ！" },
    { speaker: "PLAYER", text: "ふふ、調子のいいこと言って。…でも、本当に仕掛けが施されてそうだから気を引き締めましょう。よし、まずは洋館の中に入りましょう！" }
  ];

  const epilogueLines = [
    { speaker: "ヒナ", text: "{NAME}！すごい、大きな最後の扉が開いたよ！…って、見て、外の空が…！" },
    { speaker: "PLAYER", text: "わあ…！夕暮れから一転して、頭上には言葉を失うほどの『満天の星空』が広がっているわ…！" },
    { speaker: "ヒナ", text: "きれい…まるで私たちのこれからの未来を祝福してくれてるみたい。ずっと隣で一緒に謎を解いてくれてありがとう、{NAME}！" },
    { speaker: "PLAYER", text: "こちらこそ、ヒナがいてくれたからこそ最後まで諦めずに解き明かせたわ。本当にありがとう。" },
    { speaker: "ヒナ", text: "へへっ、照れちゃうな！さて、事件も大解決したことだし、ご褒美に街の特大パフェを食べに行こうよ！もちろん{NAME}のおごりで！" },
    { speaker: "PLAYER", text: "もう、ちゃっかりしてるんだから（笑）。行きましょ、私たちの新しい冒険へ！" }
  ];

  const stages = {
    1: {
      title: "STAGE 1: 書斎の金庫",
      objs: [
        { id: "clock", label: "古びた時計", style: "top: 22%; left: 8%; width: 120px; height: 65px;" },
        { id: "books", label: "整頓された本棚", style: "top: 48%; left: 15%; width: 120px; height: 65px;" }
      ],
      initDialogue: { speaker: "ヒナ", text: "まずは最初の部屋の調査だね！{NAME}、怪しい場所を一緒に調べてみようよ。" }
    },
    2: {
      title: "STAGE 2: 宝石のオルゴール",
      objs: [
        { id: "picture", label: "三色の絵画", style: "top: 20%; left: 8%; width: 120px; height: 65px;" },
        { id: "letter", label: "机の上の手紙", style: "top: 46%; left: 16%; width: 120px; height: 65px;" }
      ],
      initDialogue: { speaker: "PLAYER", text: "奥の部屋に進んできたけれど…あのテーブルの上にあるオルゴール、なんだか意味ありげね。" }
    },
    3: {
      title: "STAGE 3: 最後の封印扉",
      objs: [
        { id: "statue", label: "月と太陽の像", style: "top: 18%; left: 10%; width: 120px; height: 65px;" },
        { id: "stone", label: "刻まれた石碑", style: "top: 48%; left: 10%; width: 120px; height: 65px;" }
      ],
      initDialogue: { speaker: "ヒナ", text: "いよいよここが最後の扉みたい…！幼馴染の息を合わせて、絶対に突破しようね！" }
    }
  };

  function setBgImage(filename) {
    document.getElementById('game-container').style.backgroundImage = `url('${filename}')`;
  }

  function startGame() {
    const input = document.getElementById('player-name-input').value.trim();
    if (input) playerName = input;
    
    document.getElementById('start-modal').style.display = 'none';
    setBgImage(BG_OUTSIDE);
    
    // ゲーム開始直後からプロローグの1行目をしっかり表示
    currentStage = 0;
    storyIndex = 0;
    advanceStory();
  }

  function handleDialogueTap() {
    if (currentStage === 0 || currentStage === 4) {
      advanceStory();
    }
  }

  function advanceStory() {
    let lines = currentStage === 0 ? prologueLines : epilogueLines;
    
    if (storyIndex < lines.length) {
      let line = lines[storyIndex];
      let spk = line.speaker === "PLAYER" ? playerName : line.speaker;
      let txt = line.text.replace(/{NAME}/g, playerName);
      setDialogue(spk, txt);
      storyIndex++;
    } else {
      if (currentStage === 0) {
        loadStage(1);
      } else {
        document.getElementById('clear-modal').style.display = 'flex';
      }
    }
  }

  function setDialogue(speaker, text) {
    const tag = document.getElementById('speaker-tag');
    const textEl = document.getElementById('dialogue-text');
    const hinaImg = document.getElementById('img-hina');
    const tapHint = document.getElementById('tap-hint');

    const isPlayer = (speaker === playerName || speaker === "PLAYER");
    
    tag.textContent = isPlayer ? playerName : 'ヒナ';
    tag.className = `speaker-tag ${isPlayer ? 'speaker-aoi' : 'speaker-hina'}`;
    textEl.textContent = text;

    if (currentStage === 0 || currentStage === 4) {
      tapHint.style.display = 'block';
    } else {
      tapHint.style.display = 'none';
    }

    if (!isPlayer) hinaImg.classList.add('active');
    else hinaImg.classList.remove('active');
  }

  function loadStage(stageNum) {
    currentStage = stageNum;
    selectedColorSequence = [];

    setBgImage(BG_INSIDE);
    document.getElementById('action-btns-area').style.display = 'flex';

    const data = stages[stageNum];
    document.getElementById('stage-title').textContent = data.title;

    const container = document.getElementById('interactive-objects');
    container.innerHTML = '';
    data.objs.forEach((obj, index) => {
      const el = document.createElement('div');
      el.className = 'inspect-obj';
      el.style = obj.style;
      el.textContent = obj.label;
      el.onclick = () => inspectObject(index + 1, obj.id);
      container.appendChild(el);
    });

    let spk = data.initDialogue.speaker === "PLAYER" ? playerName : data.initDialogue.speaker;
    let txt = data.initDialogue.text.replace(/{NAME}/g, playerName);
    setDialogue(spk, txt);
  }

  function inspectObject(num, id) {
    if (currentStage === 1) {
      if (id === 'clock') setDialogue(playerName, "「3時」でピタリと止まっている古い時計ね。裏側に『千の位は止まった刻』って意味深に刻まれているわ。");
      else setDialogue("ヒナ", "本棚の隙間からメモを見つけたよ！『百の位は0、十の位は5、一の位は2』だって！これで金庫の番号がわかりそう！");
    } else if (currentStage === 2) {
      if (id === 'picture') setDialogue("ヒナ", "鮮やかな『赤・青・黄』のチューリップが描かれた綺麗な絵画だね。何かヒントかな？");
      else setDialogue(playerName, "手紙には『情熱（赤）で始まり、空（青）を見上げ、光（黄）に至る』って書かれているわ。オルゴールの順番ね。");
    } else if (currentStage === 3) {
      if (id === 'statue') setDialogue(playerName, "石像の台座に『夜を照らす真実の言葉（英字4文字）を刻め』って記されているわ。");
      else setDialogue("ヒナ", "隣の石碑の文字だよ！『Mで始まり、Nで終わる。夜空に浮かぶ丸いもの…』{NAME}、あれのことだよね！");
    }
  }

  function showHint() {
    if (currentStage === 1) setDialogue("ヒナ", "時計の針が指す数字(3)と、本棚で見つけたメモ(052)を組み合わせると4桁の番号になるよ！");
    else if (currentStage === 2) setDialogue(playerName, "手紙の文章にあった色の順番（情熱＝赤、空＝青、光＝黄）をそのままボタンで再現してみましょう。");
    else if (currentStage === 3) setDialogue("ヒナ", "「Mから始まってNで終わる、夜空の丸いもの」…夜空に光るアレの英単語を入力すればいけるはず！");
  }

  function openPuzzle() {
    const modal = document.getElementById('puzzle-modal');
    const body = document.getElementById('modal-body');
    modal.style.display = 'flex';

    if (currentStage === 1) {
      body.innerHTML = `<p style="font-size:0.8rem; color:#aaa;">4桁の数字を入力してください</p><input type="text" id="ans-input" class="code-input" maxlength="4" placeholder="0000" inputmode="numeric">`;
    } else if (currentStage === 2) {
      selectedColorSequence = [];
      body.innerHTML = `<p style="font-size:0.8rem; color:#aaa;">正しい順番で色ボタンを3回押してください</p>
        <div class="color-btns">
          <button class="btn-color" style="background:#e74c3c" onclick="pressColor('赤')"></button>
          <button class="btn-color" style="background:#3498db" onclick="pressColor('青')"></button>
          <button class="btn-color" style="background:#f1c40f" onclick="pressColor('黄')"></button>
        </div><div id="color-log" style="color:#e6c669; font-weight:bold; height:1.5em; margin-top:5px;"></div>`;
    } else if (currentStage === 3) {
      body.innerHTML = `<p style="font-size:0.8rem; color:#aaa;">英単語4文字（大文字）を入力してください</p><input type="text" id="ans-input" class="code-input" maxlength="4" placeholder="WORD" style="text-transform:uppercase;">`;
    }
  }

  function pressColor(color) {
    if (selectedColorSequence.length < 3) {
      selectedColorSequence.push(color);
      document.getElementById('color-log').textContent = selectedColorSequence.join(" ➔ ");
    }
  }

  function closeModal() { document.getElementById('puzzle-modal').style.display = 'none'; }

  function submitAnswer() {
    if (currentStage === 1) {
      if (document.getElementById('ans-input').value === '3052') {
        closeModal();
        setDialogue(playerName, "見事正解ね！金庫がガチャリと開いて『奥へ進む鍵』を手に入れたわ。次の部屋へ行きましょう！");
        setTimeout(() => loadStage(2), 2500);
      } else alert("番号が違うようだ…よく周りを探してみて。");
    } else if (currentStage === 2) {
      if (selectedColorSequence.join(",") === "赤,青,黄") {
        closeModal();
        setDialogue("ヒナ", "やったぁ！オルゴールから綺麗な音色が響いて、奥の隠し扉が開いたよ！いよいよラストスパートだね！");
        setTimeout(() => loadStage(3), 2500);
      } else {
        alert("音が響かない…色の順番をもう一度見直そう。");
        selectedColorSequence = []; document.getElementById('color-log').textContent = '';
      }
    } else if (currentStage === 3) {
      if (document.getElementById('ans-input').value.toUpperCase() === 'MOON') {
        closeModal(); 
        startEpilogue();
      } else alert("扉はびくともしない…正しい英単語を思い出して！");
    }
  }

  function startEpilogue() {
    currentStage = 4; 
    storyIndex = 0;
    document.getElementById('interactive-objects').innerHTML = '';
    document.getElementById('stage-title').textContent = "EPILOGUE: 満天の星空へ";
    document.getElementById('action-btns-area').style.display = 'none';
    
    // 満天の星空エフェクトを表示
    setBgImage('');
    const sky = document.getElementById('starry-sky');
    sky.style.display = 'block';
    sky.innerHTML = '';
    for(let i=0; i<40; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.width = (Math.random() * 3 + 2) + 'px';
      star.style.height = star.style.width;
      star.style.animationDelay = (Math.random() * 2) + 's';
      sky.appendChild(star);
    }

    advanceStory();
  }

  // 複数BGM対応（Web Audio APIによるシンセ演奏切り替え）
  let audioCtx = null;
  let activeBgmType = 0;
  let bgmInterval = null;

  function toggleBGM(type) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const btn1 = document.getElementById('bgm-btn-1');
    const btn2 = document.getElementById('bgm-btn-2');

    if (activeBgmType === type) {
      // 停止
      clearInterval(bgmInterval);
      activeBgmType = 0;
      btn1.classList.remove('playing');
      btn2.classList.remove('playing');
      btn1.textContent = "🎵 探索曲";
      btn2.textContent = "🎶 謎解き曲";
    } else {
      // 切り替え・再生
      clearInterval(bgmInterval);
      activeBgmType = type;
      
      btn1.classList.remove('playing');
      btn2.classList.remove('playing');
      if (type === 1) {
        btn1.classList.add('playing');
        btn1.textContent = "🎵 再生中(探索)";
        btn2.textContent = "🎶 謎解き曲";
      } else {
        btn2.classList.add('playing');
        btn2.textContent = "🎶 再生中(謎解き)";
        btn1.textContent = "🎵 探索曲";
      }

      let step = 0;
      bgmInterval = setInterval(() => {
        let notes = type === 1 ? [220, 246.94, 261.63, 329.63] : [329.63, 392.00, 440.00, 523.25, 493.88];
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type === 1 ? 'sine' : 'triangle';
        osc.frequency.value = notes[step % notes.length];
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.7);
        step++;
      }, type === 1 ? 800 : 450);
    }
  }
</script>
